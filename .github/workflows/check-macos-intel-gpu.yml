name: Check macOS Intel Runner GPU & Hypervisor

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/check-macos-intel-gpu.yml'

jobs:
  probe-intel:
    name: Probe GPU & Hypervisor on macOS Intel
    runs-on: macos-15-intel
    steps:
      - name: System & CPU Information
        run: |
          echo "============================================="
          echo "🍏 System & Architecture"
          echo "============================================="
          sw_vers
          uname -a
          echo "Architecture: $(arch)"
          echo "CPU Brand: $(sysctl -n machdep.cpu.brand_string 2>/dev/null || echo 'N/A')"
          echo "Core count: $(sysctl -n hw.ncpu 2>/dev/null || echo 'N/A')"
          echo "Memory: $(( $(sysctl -n hw.memsize 2>/dev/null || echo 0) / 1024 / 1024 / 1024 )) GB"

      - name: Probe Hypervisor & Hardware Virtualization Support
        run: |
          echo "============================================="
          echo "🛡️ Hypervisor Support Checks"
          echo "============================================="
          echo -n "kern.hv_support: "
          sysctl -n kern.hv_support || echo "kern.hv_support not found"

          echo -n "CPU Virtualization (VMX flag): "
          if sysctl -n machdep.cpu.features | grep -q -w "VMX"; then
            echo "YES (VMX flag present in CPU features)"
          else
            echo "NO (VMX flag not exposed to guest VM)"
          fi

          echo "machdep.cpu.features:"
          sysctl -n machdep.cpu.features | tr ' ' '\n' | grep -E 'VMX|EPT|EST|SMX|HYPERVISOR' || echo "No virt features found"

          echo "machdep.cpu.leaf7_features:"
          sysctl -n machdep.cpu.leaf7_features 2>/dev/null || true

          cat << 'EOF' > test_hv.swift
          import Foundation
          import Hypervisor
          import Virtualization

          print("\n--- Hypervisor.framework & Virtualization.framework Probe ---")
          if #available(macOS 11.0, *) {
              print("VZVirtualMachine.isSupported: \(VZVirtualMachine.isSupported)")
          }

          // Test hv_vm_create()
          let hvStatus = hv_vm_create(hv_vm_options_t(HV_VM_DEFAULT))
          print("hv_vm_create() return code: \(hvStatus)")
          if hvStatus == HV_SUCCESS {
              print("✅ Hypervisor.framework is FULLY FUNCTIONAL (hv_vm_create succeeded)!")
              hv_vm_destroy()
          } else if hvStatus == HV_UNSUPPORTED {
              print("❌ Hypervisor.framework is UNSUPPORTED on this runner (HV_UNSUPPORTED).")
          } else if hvStatus == HV_NO_DEVICE {
              print("❌ Hypervisor.framework failed: HV_NO_DEVICE (No hardware VT-x/VMX device).")
          } else {
              print("⚠️ Hypervisor.framework returned code: \(hvStatus)")
          }
          EOF

          swift test_hv.swift || true

      - name: Swift Metal GPU Hardware Probe
        run: |
          cat << 'EOF' > probe_metal.swift
          import Foundation
          import Metal

          print("=============================================")
          print("⚡ Metal Framework GPU Probe")
          print("=============================================")

          let devices = MTLCopyAllDevices()
          print("Total Metal devices found: \(devices.count)")

          if devices.isEmpty {
              print("❌ MTLCopyAllDevices() returned 0 devices.")
          } else {
              for (index, dev) in devices.enumerated() {
                  print("\n--- Device [\(index)]: \(dev.name) ---")
                  print("  Registry ID: \(dev.registryID)")
                  print("  Low Power: \(dev.isLowPower)")
                  print("  Headless: \(dev.isHeadless)")
                  print("  Removable: \(dev.isRemovable)")
                  print("  Unified Memory: \(dev.hasUnifiedMemory)")
                  print("  Max Working Set: \(dev.recommendedMaxWorkingSetSize / 1024 / 1024) MB")
                  print("  Max Buffer Length: \(dev.maxBufferLength / 1024 / 1024) MB")
                  print("  Supports Metal 3: \(dev.supportsFamily(.metal3))")
              }
          }

          if let defaultDevice = MTLCreateSystemDefaultDevice() {
              print("\n✅ Default Metal Device: \(defaultDevice.name)")
          } else {
              print("\n❌ MTLCreateSystemDefaultDevice() returned nil.")
          }
          EOF

          swift probe_metal.swift || true
