name: Blacksmith Runner Benchmark

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  blacksmith-test:
    name: Benchmark ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - blacksmith
          - blacksmith-4vcpu-ubuntu-2404
          - blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fio sysbench

      - name: Run Benchmark
        run: |
          chmod +x scripts/benchmark.py
          python3 scripts/benchmark.py "${{ matrix.runner }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.runner }}
          path: results/${{ matrix.runner }}.json
