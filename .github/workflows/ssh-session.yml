name: Interactive ARM64 SSH Session

on:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: "Duration to keep runner alive in hours (1 to 6)"
        required: true
        default: "2"

jobs:
  arm64-ssh:
    name: Interactive ARM64 (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Authorized SSH Keys
        run: |
          mkdir -p ~/.ssh
          curl -s https://github.com/polly67.keys >> ~/.ssh/authorized_keys
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/authorized_keys

      - name: System Diagnostics
        run: |
          echo "=== Hardware Specs ==="
          uname -a
          lscpu
          free -h
          df -h

      - name: Start Interactive SSH Session (Upterm)
        uses: owenthereal/action-upterm@v2
        with:
          limit-access-to-actor: true
          wait-timeout-minutes: 120
