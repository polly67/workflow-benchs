name: Interactive ARM64 SSH Session

on:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: "Duration to keep runner alive in hours (1 to 6)"
        required: true
        default: "2"

jobs:
  arm64-ssh:
    name: Interactive ARM64 (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120 # Keeps alive for 2 hours (can be up to 360)
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: System Diagnostics
        run: |
          echo "=== Hardware Specs ==="
          uname -a
          lscpu
          free -h
          df -h

      - name: Start Interactive SSH Session (Upterm)
        uses: owenthereal/action-upterm@v2
        with:
          ## Set to true if you have an SSH public key added to your GitHub profile (Settings -> SSH and GPG keys)
          limit-access-to-actor: false
