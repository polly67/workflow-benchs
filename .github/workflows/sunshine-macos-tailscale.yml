name: Sunshine & BetterDisplay macOS Streamer via Tailscale

on:
  workflow_dispatch:
    inputs:
      tailscale_authkey:
        description: 'Tailscale Auth Key'
        required: false
        default: ''
      display_width:
        description: 'Virtual Display Width'
        required: false
        default: '1920'
      display_height:
        description: 'Virtual Display Height'
        required: false
        default: '1080'
      sunshine_user:
        description: 'SSH & Sunshine Admin Username'
        required: false
        default: 'runner'
      sunshine_password:
        description: 'SSH & Sunshine Admin Password'
        required: false
        default: 'root'

permissions:
  contents: read

jobs:
  sunshine-macos:
    name: Run Sunshine, SSH & Virtual Display on macOS
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Install BetterDisplay & Sunshine FIRST (before Tailscale changes DNS)
      - name: Install BetterDisplay & Sunshine
        run: |
          echo "=== Installing BetterDisplay & Sunshine via Homebrew ==="
          brew install --cask betterdisplay
          brew install lizardbyte/homebrew/sunshine

      # 2. Set macOS user 'runner' password to 'root' and enable OpenSSH (sshd)
      - name: Configure User Password & Enable SSH
        env:
          TARGET_PW: ${{ github.event.inputs.sunshine_password || 'root' }}
        run: |
          echo "=== Configuring macOS user 'runner' password & OpenSSH ==="
          sudo pwpolicy -clearaccountpolicies 2>/dev/null || true
          sudo dscl . -passwd /Users/runner "$TARGET_PW"

          if dscl . -authonly runner "$TARGET_PW"; then
            echo "✅ macOS password for 'runner' verified."
          else
            echo "❌ Failed to verify password for 'runner'"
            exit 1
          fi

          sudo mkdir -p /etc/ssh/sshd_config.d
          cat << 'EOF' | sudo tee /etc/ssh/sshd_config.d/000-runner-password.conf >/dev/null
          PasswordAuthentication yes
          KbdInteractiveAuthentication yes
          UsePAM yes
          PermitRootLogin no
          EOF

          sudo sshd -t
          sudo systemsetup -setremotelogin on 2>/dev/null || true
          sudo launchctl load -w /System/Library/LaunchDaemons/ssh.plist 2>/dev/null || true
          sudo launchctl enable system/com.openssh.sshd 2>/dev/null || true
          sudo launchctl kickstart -k system/com.openssh.sshd 2>/dev/null || sudo /usr/sbin/sshd
          sleep 1

          # Self-test live SSH password login as runner
          python3 - "$TARGET_PW" << 'PYEOF'
          import os, pty, select, sys, time
          pw = sys.argv[1]
          pid, fd = pty.fork()
          if pid == 0:
              os.execvp("ssh", [
                  "ssh",
                  "-o", "StrictHostKeyChecking=no",
                  "-o", "UserKnownHostsFile=/dev/null",
                  "-o", "PreferredAuthentications=password,keyboard-interactive",
                  "-o", "PubkeyAuthentication=no",
                  "runner@127.0.0.1",
                  "echo SSH_LOGIN_OK"
              ])
          buf = b""
          sent = False
          deadline = time.time() + 15
          while time.time() < deadline:
              r, _, _ = select.select([fd], [], [], 0.5)
              if r:
                  try:
                      chunk = os.read(fd, 4096)
                  except OSError:
                      break
                  if not chunk:
                      break
                  buf += chunk
                  if (b"assword:" in buf or b"Password:" in buf) and not sent:
                      os.write(fd, (pw + "\n").encode())
                      sent = True
                  if b"SSH_LOGIN_OK" in buf:
                      print("✅ Verified live SSH login (runner@127.0.0.1)!")
                      sys.exit(0)
          print("❌ SSH login verification failed. Output:", buf.decode(errors="replace"))
          sys.exit(1)
          PYEOF

      # 3. Launch BetterDisplay and Create Virtual Display
      - name: Create Virtual Screen
        env:
          DISP_W: ${{ github.event.inputs.display_width || '1920' }}
          DISP_H: ${{ github.event.inputs.display_height || '1080' }}
        run: |
          echo "=== Launching BetterDisplay & Initializing Virtual Display ==="
          RUNNER_TRACKING_ID="" open -a /Applications/BetterDisplay.app || true
          sleep 5

          betterdisplaycli create -deviceType=virtualScreen -virtualScreenName="StreamDisplay" -aspectWidth=16 -aspectHeight=9 || true
          sleep 3
          betterdisplaycli set -name="StreamDisplay" -deviceType=VirtualScreen -connected=on || betterdisplaycli set -name="StreamDisplay" -connected=on || true
          sleep 2
          betterdisplaycli set -name="StreamDisplay" -deviceType=VirtualScreen -virtualScreenHiDPI=on || true
          betterdisplaycli set -name="StreamDisplay" -deviceType=Display -resolution="${DISP_W}x${DISP_H}" || true
          betterdisplaycli set -name="StreamDisplay" -deviceType=Display -main=on || true
          sleep 2

          echo "Displays registered:"
          betterdisplaycli get -identifiers || true

      # 4. Connect runner to your Tailscale network
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ github.event.inputs.tailscale_authkey || secrets.TAILSCALE_AUTHKEY }}
          version: latest

      # 5. Configure Sunshine (runner / root + CSRF allowed origins) & Preflight Test
      - name: Configure Sunshine & Verify CSRF
        env:
          SUN_USER: ${{ github.event.inputs.sunshine_user || 'runner' }}
          SUN_PASS: ${{ github.event.inputs.sunshine_password || 'root' }}
        run: |
          mkdir -p ~/.config/sunshine

          TS_IP=$(tailscale ip -4 | head -n1 | tr -d '[:space:]')
          TS_IPV6=$(tailscale ip -6 2>/dev/null | head -n1 | tr -d '[:space:]' || true)
          TS_JSON=$(tailscale status --json)
          TS_FQDN=$(python3 -c 'import sys,json; d=json.loads(sys.argv[1]); print(d.get("Self",{}).get("DNSName","").rstrip("."))' "$TS_JSON")
          TS_HOST=$(python3 -c 'import sys,json; d=json.loads(sys.argv[1]); print(d.get("Self",{}).get("HostName",""))' "$TS_JSON")

          ORIGINS=$(python3 - "$TS_IP" "$TS_IPV6" "$TS_FQDN" "$TS_HOST" << 'PYEOF'
          import sys
          ip4, ip6, fqdn, host = sys.argv[1:5]
          hosts = []
          for h in [ip4, f"[{ip6}]" if ip6 else "", fqdn, fqdn.lower(), host, host.lower(), "localhost", "127.0.0.1"]:
              if h and h not in hosts:
                  hosts.append(h)
          origins = []
          for h in hosts:
              origins.append(f"https://{h}:47990")
              origins.append(f"https://{h}")
          print(",".join(origins))
          PYEOF
          )

          cat << EOF > ~/.config/sunshine/sunshine.conf
          sunshine_name = macOS-Runner
          origin_web_ui_allowed = wan
          csrf_allowed_origins = $ORIGINS
          EOF

          echo "=== Generated ~/.config/sunshine/sunshine.conf ==="
          cat ~/.config/sunshine/sunshine.conf

          sunshine ~/.config/sunshine/sunshine.conf --creds "$SUN_USER" "$SUN_PASS"

          # Preflight test: verify Web UI auth + CSRF check with Tailscale IP Origin header
          sunshine ~/.config/sunshine/sunshine.conf > /tmp/sunshine-preflight.log 2>&1 &
          PRE_PID=$!
          CSRF_STATUS="untested"
          for i in {1..15}; do
            sleep 1
            HTTP_CODE=$(curl -k -s -o /tmp/pin_resp.txt -w "%{http_code}" \
              -u "${SUN_USER}:${SUN_PASS}" \
              -X POST \
              -H "Origin: https://${TS_IP}:47990" \
              -H "Content-Type: application/json" \
              -d '{"pin":"0000","name":"preflight"}' \
              "https://${TS_IP}:47990/api/pin" || true)
            if [ "$HTTP_CODE" = "200" ]; then
              CSRF_STATUS="passed_200"
              echo "✅ Sunshine Web UI auth & CSRF check PASSED (HTTP 200)!"
              break
            elif [ "$HTTP_CODE" != "000" ]; then
              CSRF_STATUS="http_${HTTP_CODE}"
              echo "Attempt $i returned HTTP $HTTP_CODE: $(cat /tmp/pin_resp.txt 2>/dev/null || true)"
            fi
          done
          kill $PRE_PID 2>/dev/null || true
          wait $PRE_PID 2>/dev/null || true

          mkdir -p /tmp/conn-info
          python3 - "$TS_IP" "$TS_IPV6" "$TS_FQDN" "$TS_HOST" "$SUN_USER" "$CSRF_STATUS" << 'PYEOF' > /tmp/conn-info/connection-info.json
          import json, sys
          ip4, ip6, fqdn, host, user, csrf = sys.argv[1:7]
          print(json.dumps({
              "tailscale_ipv4": ip4,
              "tailscale_ipv6": ip6,
              "tailscale_fqdn": fqdn,
              "tailscale_hostname": host,
              "ssh_command": f"ssh {user}@{ip4}",
              "sunshine_web_ui": f"https://{ip4}:47990",
              "sunshine_web_ui_fqdn": f"https://{fqdn}:47990" if fqdn else "",
              "username": user,
              "csrf_preflight": csrf
          }, indent=2))
          PYEOF
          cat /tmp/conn-info/connection-info.json

      # 6. Publish connection info immediately so it is accessible while Sunshine runs
      - name: Upload Connection Info
        uses: actions/upload-artifact@v4
        with:
          name: sunshine-connection-info
          path: /tmp/conn-info/connection-info.json
          retention-days: 1

      # 7. Start Sunshine & Keep Session Active
      - name: Start Sunshine & Keep Alive
        env:
          SUN_USER: ${{ github.event.inputs.sunshine_user || 'runner' }}
          SUN_PASS: ${{ github.event.inputs.sunshine_password || 'root' }}
        run: |
          # Ensure BetterDisplay is still running
          pgrep -x BetterDisplay >/dev/null || RUNNER_TRACKING_ID="" open -a /Applications/BetterDisplay.app || true
          TS_IP=$(tailscale ip -4 | head -n1 | tr -d '[:space:]')
          echo "=========================================================="
          echo "🎉 SUNSHINE & SSH ARE LIVE ON MACOS!"
          echo "=========================================================="
          echo "Tailscale IP:       $TS_IP"
          echo "SSH Access:         ssh ${SUN_USER}@${TS_IP}  (password: ${SUN_PASS})"
          echo "Sunshine Web UI:    https://${TS_IP}:47990"
          echo "Username:           ${SUN_USER}"
          echo "Password:           ${SUN_PASS}"
          echo "=========================================================="

          exec sunshine ~/.config/sunshine/sunshine.conf
