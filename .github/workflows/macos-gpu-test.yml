name: macOS Full Benchmark - CPU, Disk IOPS & GPU 3D Render

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/macos-gpu-test.yml'
      - 'scripts/gpu_3d_render.swift'
      - 'scripts/gpu_test.swift'
      - 'scripts/comprehensive_benchmark.py'

permissions:
  contents: write

jobs:
  benchmark-all:
    name: Full System Benchmark (CPU, Disk IOPS, GPU 3D Render)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Benchmark Dependencies
        run: |
          brew install fio sysbench

      - name: Run Comprehensive Benchmarks
        run: |
          chmod +x scripts/comprehensive_benchmark.py
          python3 scripts/comprehensive_benchmark.py

      - name: Upload Benchmark Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-full-benchmark-results
          path: results/
          retention-days: 7

      - name: Commit & Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add results/
          if ! git diff --staged --quiet; then
            git commit -m "docs: record full cpu, disk iops and gpu 3d render benchmark [skip ci]"
            git push origin main
          else
            echo "No new results to commit"
          fi
